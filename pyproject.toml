[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bsl-ls-mcp"
version = "0.1.0"
description = "MCP-обёртка над BSL Language Server: статический анализ и навигация по коду 1С (BSL)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vladimirov-Maxim", email = "104799483+Vladimirov-Maxim@users.noreply.github.com" }]
keywords = ["1c", "bsl", "language-server", "lsp", "mcp"]

# Рантайм: только MCP SDK (он же тянет uvicorn/starlette для sse/streamable-http).
# LSP-клиент — на стандартной библиотеке (asyncio), без доп. пакетов.
# >=1.9.4 — версия с защитой от DNS-rebinding (валидация Host/Origin) в HTTP-транспорте.
# <2 — ОБЯЗАТЕЛЬНО: mcp 2.x переименовал FastMCP -> MCPServer и сломал API; весь код на
# v1 (FastMCP), без верхней границы свежая установка тянет 2.x и демон не импортируется.
dependencies = ["mcp>=1.9.4,<2"]

[project.optional-dependencies]
# ruff запинен точно: дефолтный набор правил дрейфует между версиями (см. [tool.ruff.lint]),
# незапиненный ruff делал CI недетерминированным. Обновлять вместе с прогоном линта.
dev = ["pytest>=8", "ruff==0.16.5"]
build = ["pyinstaller>=6"]

[project.scripts]
# После `pip install .` доступна команда:  bsl-ls-mcp [--transport ...]
bsl-ls-mcp = "bsl_ls_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bsl_ls_mcp"]
# jar сервера НЕ кладём в wheel — он поставляется рядом (server/), путь задаёт BSL_LS_JAR.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# ЯВНЫЙ набор правил (классический дефолт ruff), а не неявный: дефолтная выборка
# ruff расширяется от версии к версии (0.16 стала тянуть bandit/pylint/blind-except),
# и без пина набора CI зелёный/красный зависел бы от версии ruff. Фиксируем — детерминизм.
select = ["E4", "E7", "E9", "F"]
# E731 — присваивание lambda: допускаем как компактные тест-хелперы.
ignore = ["E731"]
